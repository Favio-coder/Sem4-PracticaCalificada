<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Práctica Calificada 3</title>
</head>

<body class="min-h-screen bg-white text-black">

    <main id="inicio" class="min-h-screen flex items-center justify-center p-6">

        <div class="w-full max-w-4xl">

            <div class="text-center mb-12">
                <h1 class="text-5xl font-bold mb-4">
                    Aplicación Web (Aula Virtual)
                </h1>

                <p class="text-lg">
                    Práctica Calificada 3 (Sorteo y Ruleta)
                </p>
            </div>

            <!-- LAYOUTS -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <section class=" shadow-xl border rounded-2xl p-8 text-center">


                    <h2 class="text-2xl font-bold mb-3">
                        Parte 1
                    </h2>

                    <p class="text-slate-400 mb-6">
                        Accede a la primera parte de la práctica (Ruleta)
                    </p>

                    <button
                        id="btnParte1"
                        class="text-white w-full bg-blue-600 hover:bg-blue-500
                               px-6 py-3 rounded-lg font-semibold
                               transition cursor-pointer">
                        Ir a Parte 1
                    </button>

                </section>


                <!-- PARTE 2 -->
                <section class="shadow-xl border  rounded-2xl p-8 text-center">

                    <h2 class="text-2xl font-bold mb-3">
                        Parte 2
                    </h2>

                    <p class="text-slate-400 mb-6">
                        Accede a la segunda parte de la práctica (Sorteo)
                    </p>

                    <button
                        id="btnParte2"
                        class="text-white w-full bg-purple-600 hover:bg-purple-500
                               px-6 py-3 rounded-lg font-semibold
                               transition cursor-pointer">
                        Ir a Parte 2
                    </button>

                </section>

            </div>


            <!-- BOTONES INFERIORES -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8">

                <button
                    id="btnFullscreen"
                    class="text-white bg-blue-500 hover:bg-blue-700
                           border shadow-xl
                           px-6 py-3 rounded-lg
                           font-semibold transition cursor-pointer">
                    Pantalla completa
                </button>

                <button
                    id="btnSorteo"
                    class="text-white bg-emerald-600 hover:bg-emerald-500
                           px-6 py-3 rounded-lg
                           font-semibold transition cursor-pointer">
                    Sorteo
                </button>

            </div>

            <!-- <p class="text-center text-slate-500 text-sm mt-6">
                Atajo de teclado: <span class="text-white font-semibold">F4</span> → Sorteo
            </p> -->

        </div>

    </main>

    <footer class="bg-blue-600 flex-col">
        <div class="text-white p-1.5">
            Aplicación Web
        </div>

        <!-- Nombre e integrantes -->
        <div class="text-white ">
            <ul>
                <li>Richar</li>
                <li>Bri </li>
            </ul>
        </div>
    </footer>


    <script src="./script.js"></script>

</body>
</html>
